[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-transfer"
version = "0.1.0"
description = "Evidence-first website transfer workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.21,<5", "Jinja2>=3.1,<4", "Pillow>=11.3,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4", "celery[redis]>=5.4,<6"]
capture = ["playwright==1.56.0"]

[project.scripts]
site-transfer = "site_transfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
site_transfer = ["resources/*.json", "resources/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
